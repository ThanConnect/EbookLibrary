<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ThanConnect Ebook Library</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.app{min-height:100vh;display:flex}.sidebar{width:280px;background:#101828;color:white;padding:24px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;height:100vh}.brand{font-weight:900;font-size:22px;margin-bottom:20px}.nav{background:transparent;color:#d6dbea;border:0;border-radius:14px;padding:14px;text-align:left;font-size:15px;cursor:pointer}.nav.active,.nav:hover{background:#23304b;color:white}.content{flex:1;padding:32px}.hero{border-radius:32px;padding:44px;background:linear-gradient(135deg,#16325c,#2563eb 58%,#75c7ff);color:white;box-shadow:0 22px 60px rgba(37,99,235,.24);margin-bottom:24px}.hero h1{font-size:46px;line-height:1.08;margin:8px 0 14px;max-width:780px}.hero p{font-size:18px;max-width:760px;color:#e8f2ff}.eyebrow{letter-spacing:.14em;text-transform:uppercase;font-size:13px;font-weight:800;color:#bfdbfe}.toolbar{height:58px;background:white;border:1px solid #e6eaf2;border-radius:18px;display:flex;align-items:center;padding:0 18px;margin-bottom:22px;box-shadow:0 12px 28px rgba(15,23,42,.06)}.toolbar input{border:0;outline:0;font-size:16px;width:100%}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}.card,.panel,.row,.stat{background:white;border:1px solid #e6eaf2;border-radius:24px;box-shadow:0 14px 35px rgba(15,23,42,.07)}.card{overflow:hidden}.card img{width:100%;height:220px;object-fit:cover}.body{padding:18px}.pill{display:inline-flex;background:#eaf2ff;color:#1d4ed8;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}.card h3{font-size:22px;margin:12px 0 8px}.card p,.muted{color:#526078;line-height:1.5}.actions{padding:0 18px 18px;display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;background:#2563eb;color:white;border-radius:13px;padding:12px 16px;font-weight:800;cursor:pointer}.btn.secondary{background:#eef4ff;color:#1d4ed8}.btn.danger{background:#fee4e2;color:#b42318}.btn:disabled{background:#d0d5dd;color:#667085}.status{margin-top:auto;border-top:1px solid #34415f;padding-top:18px;color:#aeb8d0;font-size:14px}.row{padding:14px;display:flex;align-items:center;gap:16px;margin-bottom:14px}.row img{width:72px;height:96px;border-radius:14px;object-fit:cover}.grow{flex:1}.bar{height:10px;background:#eef2f6;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:#2563eb}.reader iframe{width:100%;height:60vh;border:0;border-radius:24px;background:white}.readerTools{margin-top:14px;padding:18px}.readerTools input{width:100%}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:20px 0}.stat{padding:24px}.stat b{font-size:34px;color:#2563eb;display:block}.empty{padding:28px;text-align:center;color:#667085}.toast{position:fixed;right:22px;bottom:22px;background:#101828;color:white;padding:14px 18px;border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.22)}@media(max-width:850px){.app{display:block}.sidebar{width:auto;height:auto;position:relative}.content{padding:18px}.hero{padding:28px}.hero h1{font-size:32px}.actions{flex-direction:column}.btn{width:100%}.row{align-items:flex-start;flex-direction:column}.row img{width:100%;height:180px}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const KEY='thanconnect-library-static-v2';
    const books=[
      {id:'ai',title:'AI for Education',category:'Technology',pages:120,author:'ThanConnect Research Team',desc:'แนวคิดและตัวอย่างการใช้ AI เพื่อออกแบบการเรียนรู้ยุคใหม่',cover:'https://images.unsplash.com/photo-1497633762265-9d179a990aa6?auto=format&fit=crop&w=900&q=80',url:'https://heyzine.com/flip-book/sample.pdf'},
      {id:'library',title:'Digital Library Playbook',category:'Library',pages:96,author:'Library Innovation Unit',desc:'คู่มือออกแบบคลังหนังสือดิจิทัลและประสบการณ์ผู้อ่าน',cover:'https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&w=900&q=80',url:'https://heyzine.com/flip-book/sample.pdf'},
      {id:'design',title:'Learning Design Toolkit',category:'Education',pages:144,author:'TEG Learning Lab',desc:'เครื่องมือสำหรับออกแบบบทเรียน กิจกรรม และการประเมินผล',cover:'https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?auto=format&fit=crop&w=900&q=80',url:'https://heyzine.com/flip-book/sample.pdf'}
    ];
    let state=JSON.parse(localStorage.getItem(KEY)||'{"view":"gallery","library":[],"progress":{},"bookmarks":[],"events":[],"query":"","active":null}');
    const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
    const toast=(msg)=>{const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)};
    const book=id=>books.find(b=>b.id===id);
    const event=(type,id,data={})=>state.events.push({type,bookId:id,at:new Date().toISOString(),...data});
    function borrow(id){if(!state.library.includes(id)){state.library.push(id);event('borrow_book',id);save();toast('เพิ่มเข้าชั้นหนังสือแล้ว')}render()}
    function ret(id){state.library=state.library.filter(x=>x!==id);event('return_book',id);save();render();toast('คืนหนังสือแล้ว')}
    function openBook(id){borrow(id);state.active=id;state.view='reader';event('open_book',id);save();render()}
    function setProgress(v){const b=book(state.active);state.progress[state.active]={percent:+v,page:Math.max(1,Math.round(b.pages*(+v/100))),pages:b.pages,at:new Date().toISOString()};event('update_progress',state.active,{percent:+v});save();render()}
    function mark(){const p=state.progress[state.active]||{page:1};state.bookmarks.push({bookId:state.active,page:p.page,at:new Date().toISOString()});event('bookmark',state.active,{page:p.page});save();toast('บันทึก Bookmark แล้ว');render()}
    function nav(v){state.view=v;save();render()}
    function sidebar(){return `<aside class="sidebar"><div class="brand">📚 ThanConnect Library</div><button onclick="nav('gallery')" class="nav ${state.view==='gallery'?'active':''}">แกลเลอรี</button><button onclick="nav('mine')" class="nav ${state.view==='mine'?'active':''}">ชั้นหนังสือของฉัน</button><button onclick="nav('admin')" class="nav ${state.view==='admin'?'active':''}">Dashboard</button><button onclick="localStorage.removeItem(KEY);location.reload()" class="nav">ล้างข้อมูลตัวอย่าง</button><div class="status">ผู้ใช้ทดลอง<br/>Sanga Khaonu<br/><br/>ข้อมูลถูกเก็บในเครื่องผู้ใช้ด้วย localStorage</div></aside>`}
    function gallery(){const list=books.filter(b=>(b.title+b.author+b.category).toLowerCase().includes((state.query||'').toLowerCase()));return `<main class="content"><section class="hero"><div class="eyebrow">Digital Ebook Library</div><h1>คลังหนังสือดิจิทัลสำหรับอ่านแบบพลิกหน้า</h1><p>เลือกหนังสือ ยืมเข้าชั้นส่วนตัว เปิดอ่าน Flipbook และติดตามความคืบหน้าการอ่านได้จากหน้าเดียว</p></section><div class="toolbar"><input value="${state.query||''}" oninput="state.query=this.value;save();render()" placeholder="ค้นหาชื่อหนังสือ ผู้แต่ง หรือหมวดหมู่" /></div><section class="grid">${list.map(b=>`<article class="card"><img src="${b.cover}" alt="${b.title}"><div class="body"><span class="pill">${b.category}</span><h3>${b.title}</h3><p>${b.desc}</p><p class="muted">${b.author} • ${b.pages} หน้า</p></div><div class="actions"><button class="btn" onclick="borrow('${b.id}')" ${state.library.includes(b.id)?'disabled':''}>${state.library.includes(b.id)?'อยู่ในชั้นแล้ว':'ยืมหนังสือ'}</button><button class="btn secondary" onclick="openBook('${b.id}')">เปิดอ่าน</button></div></article>`).join('')}</section></main>`}
    function mine(){return `<main class="content"><h1>ชั้นหนังสือของฉัน</h1><p class="muted">หนังสือที่ยืมไว้และความคืบหน้าการอ่าน</p>${state.library.length?state.library.map(id=>{const b=book(id),p=state.progress[id]||{percent:0,page:1,pages:b.pages};return `<div class="row"><img src="${b.cover}"><div class="grow"><h3>${b.title}</h3><p class="muted">อ่านถึงหน้า ${p.page}/${b.pages} • ${p.percent}%</p><div class="bar"><span style="width:${p.percent}%"></span></div></div><button class="btn" onclick="openBook('${id}')">อ่านต่อ</button><button class="btn danger" onclick="ret('${id}')">คืนหนังสือ</button></div>`}).join(''):'<div class="panel empty">ยังไม่มีหนังสือในชั้นส่วนตัว</div>'}</main>`}
    function reader(){const b=book(state.active),p=state.progress[state.active]||{percent:0,page:1};return `<main class="content reader"><h1>${b.title}</h1><p class="muted">Flipbook URL สามารถเปลี่ยนเป็นไฟล์ของคุณได้ภายหลัง</p><iframe src="${b.url}" title="${b.title}"></iframe><div class="panel readerTools"><p><b>ความคืบหน้า:</b> ${p.percent}% • หน้า ${p.page}/${b.pages}</p><input type="range" min="0" max="100" value="${p.percent}" onchange="setProgress(this.value)"><div class="actions" style="padding:18px 0 0"><button class="btn" onclick="mark()">Bookmark</button><button class="btn secondary" onclick="setProgress(100)">อ่านจบแล้ว</button><button class="btn danger" onclick="ret('${b.id}')">คืนหนังสือ</button></div></div></main>`}
    function admin(){const avg=Object.values(state.progress).length?Math.round(Object.values(state.progress).reduce((s,p)=>s+p.percent,0)/Object.values(state.progress).length):0;return `<main class="content"><h1>Dashboard ผู้ดูแล</h1><div class="stats"><div class="stat"><b>${books.length}</b><span>หนังสือทั้งหมด</span></div><div class="stat"><b>${state.library.length}</b><span>กำลังยืม</span></div><div class="stat"><b>${state.bookmarks.length}</b><span>Bookmarks</span></div><div class="stat"><b>${avg}%</b><span>ค่าเฉลี่ยการอ่าน</span></div></div><h2>กิจกรรมล่าสุด</h2>${state.events.slice(-12).reverse().map(e=>`<div class="row"><div class="grow"><b>${e.type}</b><p class="muted">${book(e.bookId)?.title||'-'} ${e.percent?`• ${e.percent}%`:''} ${e.page?`• หน้า ${e.page}`:''}</p></div><small>${new Date(e.at).toLocaleString('th-TH')}</small></div>`).join('')||'<div class="panel empty">ยังไม่มีกิจกรรม</div>'}</main>`}
    function render(){document.getElementById('app').innerHTML=`<div class="app">${sidebar()}${state.view==='gallery'?gallery():state.view==='mine'?mine():state.view==='reader'&&state.active?reader():admin()}</div>`}
    render();
  </script>
</body>
</html>
