<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ThanConnect Ebook Library</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.app{min-height:100vh;display:flex}.sidebar{width:280px;background:#101828;color:white;padding:24px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;height:100vh}.brand{font-weight:900;font-size:22px;margin-bottom:20px}.nav{background:transparent;color:#d6dbea;border:0;border-radius:14px;padding:14px;text-align:left;font-size:15px;cursor:pointer}.nav.active,.nav:hover{background:#23304b;color:white}.content{flex:1;padding:32px}.hero{border-radius:32px;padding:44px;background:linear-gradient(135deg,#16325c,#2563eb 58%,#75c7ff);color:white;box-shadow:0 22px 60px rgba(37,99,235,.24);margin-bottom:24px}.hero h1{font-size:46px;line-height:1.08;margin:8px 0 14px;max-width:780px}.hero p{font-size:18px;max-width:760px;color:#e8f2ff}.eyebrow{letter-spacing:.14em;text-transform:uppercase;font-size:13px;font-weight:800;color:#bfdbfe}.toolbar{height:58px;background:white;border:1px solid #e6eaf2;border-radius:18px;display:flex;align-items:center;padding:0 18px;margin-bottom:22px;box-shadow:0 12px 28px rgba(15,23,42,.06)}.toolbar input{border:0;outline:0;font-size:16px;width:100%}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}.card,.panel,.row,.stat{background:white;border:1px solid #e6eaf2;border-radius:24px;box-shadow:0 14px 35px rgba(15,23,42,.07)}.card{overflow:hidden}.card img{width:100%;height:220px;object-fit:cover}.body{padding:18px}.pill{display:inline-flex;background:#eaf2ff;color:#1d4ed8;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}.card h3{font-size:22px;margin:12px 0 8px}.card p,.muted{color:#526078;line-height:1.5}.actions{padding:0 18px 18px;display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;background:#2563eb;color:white;border-radius:13px;padding:12px 16px;font-weight:800;cursor:pointer}.btn.secondary{background:#eef4ff;color:#1d4ed8}.btn.danger{background:#fee4e2;color:#b42318}.btn:disabled{background:#d0d5dd;color:#667085}.status{margin-top:auto;border-top:1px solid #34415f;padding-top:18px;color:#aeb8d0;font-size:14px}.row{padding:14px;display:flex;align-items:center;gap:16px;margin-bottom:14px}.row img,.avatar{width:72px;height:96px;border-radius:14px;object-fit:cover}.avatar{height:72px;border-radius:999px}.grow{flex:1}.bar{height:10px;background:#eef2f6;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:#2563eb}.reader iframe{width:100%;height:60vh;border:0;border-radius:24px;background:white}.readerTools{margin-top:14px;padding:18px}.readerTools input{width:100%}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:20px 0}.stat{padding:24px}.stat b{font-size:34px;color:#2563eb;display:block}.empty{padding:28px;text-align:center;color:#667085}.toast{position:fixed;right:22px;bottom:22px;background:#101828;color:white;padding:14px 18px;border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.22)}.form{padding:22px;margin:18px 0}.formGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field label{display:block;font-weight:800;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid #d9e1ef;border-radius:14px;padding:12px 14px;font:inherit;background:#fff}.field textarea{min-height:92px;resize:vertical}.full{grid-column:1/-1}.backupBox{width:100%;min-height:120px;border:1px solid #d9e1ef;border-radius:14px;padding:12px;margin-top:10px;font:inherit}.coverPreview{max-width:180px;height:130px;border-radius:18px;object-fit:cover;border:1px solid #d9e1ef;margin-top:10px}.miniGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.smallCard{padding:18px}.smallCard b{display:block;margin-bottom:6px}.mobileOnly{display:none}@media(max-width:850px){body{padding-bottom:76px}.app{display:block}.sidebar{width:100%;height:auto;position:sticky;top:0;z-index:5;padding:10px 12px;display:block}.brand{font-size:17px;margin:0}.status,.sidebar .nav{display:none}.mobileOnly{display:flex}.bottomNav{position:fixed;left:0;right:0;bottom:0;height:66px;background:#101828;z-index:10;padding:7px;gap:6px;box-shadow:0 -10px 30px rgba(0,0,0,.18)}.bottomNav button{flex:1;border:0;border-radius:14px;background:transparent;color:#d6dbea;font-size:11px;font-weight:800}.bottomNav button.active{background:#23304b;color:#fff}.content{padding:12px}.hero{padding:16px;border-radius:18px;margin-bottom:12px}.hero h1{font-size:23px;margin:4px 0 6px}.hero p{font-size:13px;line-height:1.35;margin:0}.eyebrow{font-size:10px}.toolbar{height:44px;border-radius:14px;margin-bottom:12px}.toolbar input{font-size:14px}.grid{grid-template-columns:1fr;gap:10px}.card{display:grid;grid-template-columns:86px 1fr;border-radius:16px}.card img{width:86px;height:132px}.body{padding:10px}.pill{font-size:10px;padding:4px 8px}.card h3{font-size:16px;margin:6px 0 4px}.card p{font-size:12px;line-height:1.3;margin:0 0 5px}.card .muted{font-size:11px}.actions{grid-column:1/-1;padding:0 10px 10px;gap:7px;flex-direction:row}.btn{width:auto;flex:1;padding:10px 11px;border-radius:11px;font-size:12px}.row{padding:10px;border-radius:16px;gap:10px;align-items:center;flex-direction:row}.row img{width:56px;height:76px;border-radius:10px}.row .avatar,.avatar{width:52px;height:52px}.row h3{font-size:16px;margin:0 0 4px}.row .muted{font-size:12px;margin:0 0 7px}.reader iframe{height:58vh;border-radius:16px}.readerTools{padding:12px}.stats{grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}.stat{padding:14px;border-radius:16px}.stat b{font-size:24px}.form{padding:14px;margin:12px 0}.formGrid{grid-template-columns:1fr;gap:10px}.field label{font-size:13px}.field input,.field textarea,.field select{padding:10px;border-radius:12px}.miniGrid{grid-template-columns:1fr;gap:10px}.smallCard{padding:14px}.backupBox{min-height:90px}.toast{left:12px;right:12px;bottom:78px;text-align:center}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const KEY='thanconnect-library-static-v5';
    const old=JSON.parse(localStorage.getItem('thanconnect-library-static-v4')||localStorage.getItem('thanconnect-library-static-v3')||'{}');
    const defaultBooks=[
      {id:'ai',title:'AI for Education',category:'Technology',pages:120,author:'ThanConnect Research Team',desc:'แนวคิดและตัวอย่างการใช้ AI เพื่อออกแบบการเรียนรู้ยุคใหม่',cover:'https://images.unsplash.com/photo-1497633762265-9d179a990aa6?auto=format&fit=crop&w=900&q=80',url:'https://heyzine.com/flip-book/sample.pdf'},
      {id:'library',title:'Digital Library Playbook',category:'Library',pages:96,author:'Library Innovation Unit',desc:'คู่มือออกแบบคลังหนังสือดิจิทัลและประสบการณ์ผู้อ่าน',cover:'https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&w=900&q=80',url:'https://heyzine.com/flip-book/sample.pdf'},
      {id:'design',title:'Learning Design Toolkit',category:'Education',pages:144,author:'TEG Learning Lab',desc:'เครื่องมือสำหรับออกแบบบทเรียน กิจกรรม และการประเมินผล',cover:'https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?auto=format&fit=crop&w=900&q=80',url:'https://heyzine.com/flip-book/sample.pdf'}
    ];
    const defaultUsers=[{id:'u1',name:'Sanga Khaonu',email:'appmigs@gmail.com',role:'admin',status:'active',avatar:'https://api.dicebear.com/8.x/initials/svg?seed=Sanga',joinedAt:new Date().toISOString()},{id:'u2',name:'Reader Demo',email:'reader@example.com',role:'reader',status:'active',avatar:'https://api.dicebear.com/8.x/initials/svg?seed=Reader',joinedAt:new Date().toISOString()}];
    let state=JSON.parse(localStorage.getItem(KEY)||JSON.stringify(old||{}));
    state={view:'gallery',books:defaultBooks,users:defaultUsers,currentUserId:'u1',library:[],progress:{},bookmarks:[],events:[],query:'',active:null,backup:'',coverData:'',...state};
    if(!state.users)state.users=defaultUsers;if(!state.currentUserId)state.currentUserId=state.users[0].id;
    const books=()=>state.books;
    const user=()=>state.users.find(u=>u.id===state.currentUserId)||state.users[0];
    const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
    const toast=(msg)=>{const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)};
    const book=id=>books().find(b=>b.id===id);
    const event=(type,id,data={})=>state.events.push({type,bookId:id,userId:state.currentUserId,at:new Date().toISOString(),...data});
    const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
    const userKey=(id)=>`${state.currentUserId}:${id}`;
    const userLibrary=()=>state.library.filter(x=>String(x).includes(':')?x.startsWith(state.currentUserId+':'):true);
    function isBorrowed(id){return state.library.includes(userKey(id))||state.library.includes(id)}
    function borrow(id){if(!isBorrowed(id)){state.library.push(userKey(id));event('borrow_book',id);save();toast('เพิ่มเข้าชั้นหนังสือแล้ว')}render()}
    function ret(id){state.library=state.library.filter(x=>x!==userKey(id)&&x!==id);event('return_book',id);save();render();toast('คืนหนังสือแล้ว')}
    function openBook(id){borrow(id);state.active=id;state.view='reader';event('open_book',id);save();render()}
    function setProgress(v){const b=book(state.active);state.progress[userKey(state.active)]={percent:+v,page:Math.max(1,Math.round(b.pages*(+v/100))),pages:b.pages,at:new Date().toISOString()};event('update_progress',state.active,{percent:+v});save();render()}
    function getProgress(id){return state.progress[userKey(id)]||state.progress[id]||{percent:0,page:1}}
    function mark(){const p=getProgress(state.active);state.bookmarks.push({id:'bm-'+Date.now(),userId:state.currentUserId,bookId:state.active,page:p.page,at:new Date().toISOString()});event('bookmark',state.active,{page:p.page});save();toast('บันทึก Bookmark แล้ว');render()}
    function removeBookmark(id){state.bookmarks=state.bookmarks.filter(b=>b.id!==id);save();toast('ลบ Bookmark แล้ว');render()}
    function nav(v){state.view=v;save();render()}
    function switchUser(id){state.currentUserId=id;state.view='profile';save();toast('สลับผู้ใช้งานแล้ว');render()}
    function updateProfile(e){e.preventDefault();const data=Object.fromEntries(new FormData(e.target).entries());state.users=state.users.map(u=>u.id===state.currentUserId?{...u,name:data.name,email:data.email,role:data.role,avatar:data.avatar||u.avatar}:u);event('update_profile',null);save();toast('อัปเดตโปรไฟล์แล้ว');render()}
    function addUser(e){e.preventDefault();const data=Object.fromEntries(new FormData(e.target).entries());const id='u'+Date.now();state.users.push({id,name:data.name,email:data.email,role:data.role||'reader',status:'active',avatar:data.avatar||`https://api.dicebear.com/8.x/initials/svg?seed=${encodeURIComponent(data.name)}`,joinedAt:new Date().toISOString()});event('add_user',null,{targetUser:id});e.target.reset();save();toast('เพิ่มผู้ใช้งานแล้ว');render()}
    function toggleUser(id){state.users=state.users.map(u=>u.id===id?{...u,status:u.status==='active'?'disabled':'active'}:u);event('toggle_user',null,{targetUser:id});save();render()}
    function deleteUser(id){if(id===state.currentUserId){toast('ลบผู้ใช้ที่กำลังใช้งานไม่ได้');return}state.users=state.users.filter(u=>u.id!==id);state.library=state.library.filter(x=>!String(x).startsWith(id+':'));state.bookmarks=state.bookmarks.filter(x=>x.userId!==id);event('delete_user',null,{targetUser:id});save();render()}
    function readCover(input){const file=input.files&&input.files[0];if(!file)return;if(file.size>900000){toast('ไฟล์ใหญ่เกินไป แนะนำไม่เกิน 900KB');input.value='';return}const reader=new FileReader();reader.onload=()=>{state.coverData=reader.result;save();render();toast('โหลดปกจากไฟล์แล้ว')};reader.readAsDataURL(file)}
    function addBook(e){e.preventDefault();const f=e.target;const data=Object.fromEntries(new FormData(f).entries());const id='book-'+Date.now();state.books.push({id,title:data.title,author:data.author||'ไม่ระบุผู้แต่ง',category:data.category||'ทั่วไป',pages:Math.max(1,parseInt(data.pages||'1',10)),desc:data.desc||'ไม่มีคำอธิบาย',cover:state.coverData||data.cover||'https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=900&q=80',url:data.url||'https://heyzine.com/flip-book/sample.pdf'});state.coverData='';event('add_book',id);f.reset();save();toast('เพิ่มหนังสือใหม่แล้ว');state.view='gallery';render()}
    function deleteBook(id){state.books=state.books.filter(b=>b.id!==id);state.library=state.library.filter(x=>!String(x).endsWith(':'+id)&&x!==id);state.bookmarks=state.bookmarks.filter(x=>x.bookId!==id);Object.keys(state.progress).forEach(k=>{if(k.endsWith(':'+id)||k===id)delete state.progress[k]});event('delete_book',id);save();toast('ลบหนังสือแล้ว');render()}
    function exportData(){state.backup=JSON.stringify({books:state.books,users:state.users,currentUserId:state.currentUserId,library:state.library,progress:state.progress,bookmarks:state.bookmarks,events:state.events},null,2);render();toast('สร้างข้อมูลสำรองแล้ว')}
    function importData(){try{const data=JSON.parse(document.getElementById('backupText').value);state={...state,...data,view:'admin'};save();toast('นำเข้าข้อมูลแล้ว');render()}catch(e){toast('ไฟล์ข้อมูลไม่ถูกต้อง')}}
    function topBooks(){return books().map(b=>({b,opens:state.events.filter(e=>e.bookId===b.id&&e.type==='open_book').length,borrows:state.events.filter(e=>e.bookId===b.id&&e.type==='borrow_book').length,progress:getProgress(b.id).percent||0})).sort((a,b)=>(b.opens+b.borrows+b.progress)-(a.opens+a.borrows+a.progress)).slice(0,5)}
    function sidebar(){const u=user();return `<aside class="sidebar"><div class="brand">📚 ThanConnect Library</div><button onclick="nav('gallery')" class="nav ${state.view==='gallery'?'active':''}">แกลเลอรี</button><button onclick="nav('mine')" class="nav ${state.view==='mine'?'active':''}">ชั้นหนังสือของฉัน</button><button onclick="nav('bookmarks')" class="nav ${state.view==='bookmarks'?'active':''}">Bookmarks</button><button onclick="nav('profile')" class="nav ${state.view==='profile'?'active':''}">โปรไฟล์</button><button onclick="nav('users')" class="nav ${state.view==='users'?'active':''}">จัดการผู้ใช้</button><button onclick="nav('admin')" class="nav ${state.view==='admin'?'active':''}">Dashboard / Admin</button><button onclick="localStorage.removeItem(KEY);localStorage.removeItem('thanconnect-library-static-v4');localStorage.removeItem('thanconnect-library-static-v3');location.reload()" class="nav">ล้างข้อมูลตัวอย่าง</button><div class="status">${esc(u.name)}<br/>${esc(u.role)} • ${esc(u.status)}<br/><br/>มี Profile และ User Management แล้ว</div></aside>`}
    function bottomNav(){return `<nav class="bottomNav mobileOnly"><button onclick="nav('gallery')" class="${state.view==='gallery'?'active':''}">หน้าแรก</button><button onclick="nav('mine')" class="${state.view==='mine'?'active':''}">ชั้น</button><button onclick="nav('bookmarks')" class="${state.view==='bookmarks'?'active':''}">บันทึก</button><button onclick="nav('profile')" class="${state.view==='profile'||state.view==='users'?'active':''}">โปรไฟล์</button><button onclick="nav('admin')" class="${state.view==='admin'?'active':''}">Admin</button></nav>`}
    function gallery(){const list=books().filter(b=>(b.title+b.author+b.category).toLowerCase().includes((state.query||'').toLowerCase()));return `<main class="content"><section class="hero"><div class="eyebrow">Digital Ebook Library</div><h1>คลังหนังสือดิจิทัล</h1><p>${esc(user().name)} • ยืม อ่าน Flipbook และติดตามความคืบหน้า</p></section><div class="toolbar"><input value="${esc(state.query||'')}" oninput="state.query=this.value;save();render()" placeholder="ค้นหาหนังสือ" /></div><section class="grid">${list.map(b=>`<article class="card"><img src="${esc(b.cover)}" alt="${esc(b.title)}"><div class="body"><span class="pill">${esc(b.category)}</span><h3>${esc(b.title)}</h3><p>${esc(b.desc)}</p><p class="muted">${esc(b.author)} • ${b.pages} หน้า</p></div><div class="actions"><button class="btn" onclick="borrow('${b.id}')" ${isBorrowed(b.id)?'disabled':''}>${isBorrowed(b.id)?'อยู่ในชั้น':'ยืม'}</button><button class="btn secondary" onclick="openBook('${b.id}')">อ่าน</button></div></article>`).join('')}</section></main>`}
    function mine(){const items=userLibrary().map(x=>String(x).includes(':')?x.split(':')[1]:x);return `<main class="content"><h1>ชั้นหนังสือของฉัน</h1><p class="muted">${esc(user().name)} • หนังสือที่ยืมไว้</p>${items.length?items.map(id=>{const b=book(id);if(!b)return'';const p=getProgress(id);return `<div class="row"><img src="${esc(b.cover)}"><div class="grow"><h3>${esc(b.title)}</h3><p class="muted">หน้า ${p.page}/${b.pages} • ${p.percent}%</p><div class="bar"><span style="width:${p.percent}%"></span></div></div><button class="btn" onclick="openBook('${id}')">อ่านต่อ</button><button class="btn danger" onclick="ret('${id}')">คืน</button></div>`}).join(''):'<div class="panel empty">ยังไม่มีหนังสือในชั้นส่วนตัว</div>'}</main>`}
    function bookmarks(){const marks=state.bookmarks.filter(m=>!m.userId||m.userId===state.currentUserId);return `<main class="content"><h1>Bookmarks</h1><p class="muted">จุดอ่านที่บันทึกไว้ของ ${esc(user().name)}</p>${marks.length?marks.slice().reverse().map(m=>{const b=book(m.bookId);if(!b)return'';return `<div class="row"><img src="${esc(b.cover)}"><div class="grow"><h3>${esc(b.title)}</h3><p class="muted">หน้า ${m.page} • ${new Date(m.at).toLocaleString('th-TH')}</p></div><button class="btn" onclick="openBook('${b.id}')">อ่าน</button><button class="btn danger" onclick="removeBookmark('${m.id}')">ลบ</button></div>`}).join(''):'<div class="panel empty">ยังไม่มี Bookmark</div>'}</main>`}
    function reader(){const b=book(state.active),p=getProgress(state.active);return `<main class="content reader"><h1>${esc(b.title)}</h1><p class="muted">${esc(user().name)} • หน้า ${p.page}/${b.pages} • ${p.percent}%</p><iframe src="${esc(b.url)}" title="${esc(b.title)}"></iframe><div class="panel readerTools"><input type="range" min="0" max="100" value="${p.percent}" onchange="setProgress(this.value)"><div class="actions" style="padding:12px 0 0"><button class="btn" onclick="mark()">Bookmark</button><button class="btn secondary" onclick="setProgress(100)">อ่านจบ</button><button class="btn danger" onclick="ret('${b.id}')">คืน</button></div></div></main>`}
    function profile(){const u=user();const readCount=userLibrary().length;const avg=Object.entries(state.progress).filter(([k])=>k.startsWith(state.currentUserId+':')).length?Math.round(Object.entries(state.progress).filter(([k])=>k.startsWith(state.currentUserId+':')).reduce((s,[,p])=>s+p.percent,0)/Object.entries(state.progress).filter(([k])=>k.startsWith(state.currentUserId+':')).length):0;return `<main class="content"><h1>โปรไฟล์ผู้ใช้งาน</h1><div class="row"><img class="avatar" src="${esc(u.avatar)}"><div class="grow"><h3>${esc(u.name)}</h3><p class="muted">${esc(u.email)} • ${esc(u.role)} • ${esc(u.status)}</p></div><button class="btn secondary" onclick="nav('users')">จัดการผู้ใช้</button></div><div class="stats"><div class="stat"><b>${readCount}</b><span>หนังสือในชั้น</span></div><div class="stat"><b>${state.bookmarks.filter(m=>m.userId===state.currentUserId).length}</b><span>Bookmarks</span></div><div class="stat"><b>${avg}%</b><span>อ่านเฉลี่ย</span></div><div class="stat"><b>${state.events.filter(e=>e.userId===state.currentUserId).length}</b><span>กิจกรรม</span></div></div><section class="panel form"><h2>แก้ไขโปรไฟล์</h2><form onsubmit="updateProfile(event)" class="formGrid"><div class="field"><label>ชื่อ</label><input name="name" value="${esc(u.name)}" required></div><div class="field"><label>Email</label><input name="email" value="${esc(u.email)}" required></div><div class="field"><label>Role</label><select name="role"><option ${u.role==='reader'?'selected':''} value="reader">reader</option><option ${u.role==='librarian'?'selected':''} value="librarian">librarian</option><option ${u.role==='admin'?'selected':''} value="admin">admin</option></select></div><div class="field"><label>Avatar URL</label><input name="avatar" value="${esc(u.avatar)}"></div><div class="full"><button class="btn" type="submit">บันทึกโปรไฟล์</button></div></form></section></main>`}
    function usersPage(){return `<main class="content"><h1>จัดการผู้ใช้งาน</h1><p class="muted">เพิ่มผู้ใช้ สลับผู้ใช้งาน และกำหนดสิทธิ์เบื้องต้น</p><section class="panel form"><h2>เพิ่มผู้ใช้งาน</h2><form onsubmit="addUser(event)" class="formGrid"><div class="field"><label>ชื่อ</label><input name="name" required></div><div class="field"><label>Email</label><input name="email" required></div><div class="field"><label>Role</label><select name="role"><option value="reader">reader</option><option value="librarian">librarian</option><option value="admin">admin</option></select></div><div class="field"><label>Avatar URL</label><input name="avatar"></div><div class="full"><button class="btn" type="submit">เพิ่มผู้ใช้</button></div></form></section>${state.users.map(u=>`<div class="row"><img class="avatar" src="${esc(u.avatar)}"><div class="grow"><h3>${esc(u.name)}</h3><p class="muted">${esc(u.email)} • ${esc(u.role)} • ${esc(u.status)} ${u.id===state.currentUserId?'• กำลังใช้งาน':''}</p></div><button class="btn secondary" onclick="switchUser('${u.id}')">ใช้บัญชีนี้</button><button class="btn" onclick="toggleUser('${u.id}')">${u.status==='active'?'ปิด':'เปิด'}</button><button class="btn danger" onclick="deleteUser('${u.id}')">ลบ</button></div>`).join('')}</main>`}
    function admin(){const avg=Object.values(state.progress).length?Math.round(Object.values(state.progress).reduce((s,p)=>s+p.percent,0)/Object.values(state.progress).length):0;return `<main class="content"><h1>Dashboard / Admin</h1><div class="stats"><div class="stat"><b>${books().length}</b><span>หนังสือ</span></div><div class="stat"><b>${state.users.length}</b><span>ผู้ใช้</span></div><div class="stat"><b>${state.library.length}</b><span>ยืม</span></div><div class="stat"><b>${avg}%</b><span>อ่านเฉลี่ย</span></div></div><section class="miniGrid">${topBooks().map(x=>`<div class="panel smallCard"><b>${esc(x.b.title)}</b><p class="muted">เปิด ${x.opens} • ยืม ${x.borrows} • ${x.progress}%</p><div class="bar"><span style="width:${x.progress}%"></span></div></div>`).join('')}</section><section class="panel form"><h2>เพิ่มหนังสือใหม่</h2><form onsubmit="addBook(event)" class="formGrid"><div class="field"><label>ชื่อหนังสือ *</label><input name="title" required placeholder="ชื่อหนังสือ"></div><div class="field"><label>ผู้แต่ง</label><input name="author" placeholder="ชื่อผู้แต่ง"></div><div class="field"><label>หมวดหมู่</label><input name="category" placeholder="Education"></div><div class="field"><label>จำนวนหน้า</label><input name="pages" type="number" min="1" value="100"></div><div class="field full"><label>คำอธิบาย</label><textarea name="desc" placeholder="รายละเอียดหนังสือ"></textarea></div><div class="field"><label>อัปโหลดปก</label><input type="file" accept="image/*" onchange="readCover(this)">${state.coverData?`<img class="coverPreview" src="${state.coverData}">`:''}</div><div class="field"><label>หรือ URL ปก</label><input name="cover" placeholder="https://..."></div><div class="field full"><label>Flipbook URL</label><input name="url" placeholder="https://..."></div><div class="full"><button class="btn" type="submit">เพิ่มหนังสือ</button></div></form></section><h2>จัดการหนังสือ</h2>${books().map(b=>`<div class="row"><img src="${esc(b.cover)}"><div class="grow"><b>${esc(b.title)}</b><p class="muted">${esc(b.category)} • ${b.pages} หน้า</p></div><button class="btn secondary" onclick="openBook('${b.id}')">ดู</button><button class="btn danger" onclick="deleteBook('${b.id}')">ลบ</button></div>`).join('')}<section class="panel form"><h2>สำรอง / นำเข้า</h2><div class="actions" style="padding:0"><button class="btn secondary" onclick="exportData()">Export</button><button class="btn" onclick="importData()">Import</button></div><textarea id="backupText" class="backupBox" placeholder="กด Export หรือวาง JSON">${esc(state.backup||'')}</textarea></section></main>`}
    function render(){document.getElementById('app').innerHTML=`<div class="app">${sidebar()}${state.view==='gallery'?gallery():state.view==='mine'?mine():state.view==='bookmarks'?bookmarks():state.view==='profile'?profile():state.view==='users'?usersPage():state.view==='reader'&&state.active?reader():admin()}${bottomNav()}</div>`}
    render();
  </script>
</body>
</html>
