<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ThanConnect Ebook Library</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.app{min-height:100vh;display:flex}.sidebar{width:280px;background:#101828;color:white;padding:18px;display:flex;flex-direction:column;gap:10px;position:sticky;top:0;height:100vh}.brand{font-weight:900;font-size:20px;margin-bottom:14px}.nav{background:transparent;color:#d6dbea;border:0;border-radius:14px;padding:13px;text-align:left;font-size:15px;cursor:pointer}.nav.active,.nav:hover{background:#23304b;color:white}.content{flex:1;padding:24px}.hero{border-radius:24px;padding:28px;background:linear-gradient(135deg,#16325c,#2563eb 58%,#75c7ff);color:white;box-shadow:0 18px 45px rgba(37,99,235,.22);margin-bottom:16px}.hero h1{font-size:34px;line-height:1.1;margin:8px 0}.hero p{font-size:16px;max-width:760px;color:#e8f2ff}.badge{display:inline-flex;background:#ecfdf3;color:#027a48;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900}.toolbar{height:48px;background:white;border:1px solid #e6eaf2;border-radius:16px;display:flex;align-items:center;padding:0 14px;margin-bottom:16px;box-shadow:0 10px 24px rgba(15,23,42,.06)}.toolbar input{border:0;outline:0;font-size:15px;width:100%}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.card,.panel,.row,.stat{background:white;border:1px solid #e6eaf2;border-radius:20px;box-shadow:0 10px 26px rgba(15,23,42,.06)}.card{overflow:hidden}.card img{width:100%;height:170px;object-fit:cover}.body{padding:14px}.pill{display:inline-flex;background:#eaf2ff;color:#1d4ed8;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.card h3{font-size:19px;margin:9px 0 6px}.card p,.muted{color:#526078;line-height:1.45}.actions{padding:0 14px 14px;display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;background:#2563eb;color:white;border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.secondary{background:#eef4ff;color:#1d4ed8}.btn.danger{background:#fee4e2;color:#b42318}.btn:disabled{background:#d0d5dd;color:#667085}.status{margin-top:auto;border-top:1px solid #34415f;padding-top:14px;color:#aeb8d0;font-size:13px}.row{padding:12px;display:flex;align-items:center;gap:12px;margin-bottom:12px}.row img,.avatar{width:58px;height:78px;border-radius:12px;object-fit:cover}.avatar{height:58px;border-radius:999px}.grow{flex:1}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}.stat{padding:18px}.stat b{font-size:28px;color:#2563eb;display:block}.empty{padding:24px;text-align:center;color:#667085}.toast{position:fixed;right:18px;bottom:18px;background:#101828;color:white;padding:12px 15px;border-radius:12px;box-shadow:0 14px 35px rgba(0,0,0,.2)}.mobileOnly{display:none}@media(max-width:850px){body{padding-bottom:70px}.app{display:block}.sidebar{width:100%;height:auto;position:sticky;top:0;z-index:5;padding:10px 12px;display:block}.brand{font-size:17px;margin:0}.status,.sidebar .nav{display:none}.mobileOnly{display:flex}.bottomNav{position:fixed;left:0;right:0;bottom:0;height:64px;background:#101828;z-index:10;padding:7px;gap:6px}.bottomNav button{flex:1;border:0;border-radius:13px;background:transparent;color:#d6dbea;font-size:11px;font-weight:800}.bottomNav button.active{background:#23304b;color:#fff}.content{padding:12px}.hero{padding:16px;border-radius:18px;margin-bottom:12px}.hero h1{font-size:23px}.hero p{font-size:13px;margin:0}.grid{grid-template-columns:1fr;gap:10px}.card{display:grid;grid-template-columns:84px 1fr;border-radius:16px}.card img{width:84px;height:126px}.body{padding:10px}.card h3{font-size:16px;margin:5px 0}.card p{font-size:12px;margin:0 0 5px}.actions{grid-column:1/-1;padding:0 10px 10px}.btn{flex:1;padding:10px;font-size:12px}.stats{grid-template-columns:repeat(2,1fr)}.row{padding:10px}.row img{width:52px;height:70px}}
  </style>
</head>
<body>
<div id="app"></div>
<script>
const KEY='thanconnect-visible-demo-v1';
const books=[
{id:'ai',title:'AI for Education',author:'ThanConnect Research Team',category:'Technology',pages:120,description:'แนวคิดและตัวอย่างการใช้ AI เพื่อออกแบบการเรียนรู้ยุคใหม่',cover:'https://images.unsplash.com/photo-1497633762265-9d179a990aa6?auto=format&fit=crop&w=900&q=80'},
{id:'lib',title:'Digital Library Playbook',author:'Library Innovation Unit',category:'Library',pages:96,description:'คู่มือออกแบบคลังหนังสือดิจิทัลและประสบการณ์ผู้อ่าน',cover:'https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&w=900&q=80'},
{id:'design',title:'Learning Design Toolkit',author:'TEG Learning Lab',category:'Education',pages:144,description:'เครื่องมือสำหรับออกแบบบทเรียน กิจกรรม และการประเมินผล',cover:'https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?auto=format&fit=crop&w=900&q=80'}
];
let state=JSON.parse(localStorage.getItem(KEY)||'{"view":"gallery","library":[],"bookmarks":[],"query":""}');
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function toast(msg){const e=document.createElement('div');e.className='toast';e.textContent=msg;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
function nav(view){state.view=view;save();render()}
function borrow(id){if(!state.library.includes(id)){state.library.push(id);save();toast('ยืมหนังสือแล้ว')}render()}
function ret(id){state.library=state.library.filter(x=>x!==id);save();toast('คืนหนังสือแล้ว');render()}
function mark(id){state.bookmarks.unshift({id:'bm'+Date.now(),bookId:id,page:1,at:new Date().toISOString()});save();toast('บันทึก Bookmark แล้ว');render()}
function sidebar(){return `<aside class="sidebar"><div class="brand">📚 ThanConnect Library</div><button class="nav ${state.view==='gallery'?'active':''}" onclick="nav('gallery')">หนังสือ</button><button class="nav ${state.view==='library'?'active':''}" onclick="nav('library')">ชั้นของฉัน</button><button class="nav ${state.view==='bookmarks'?'active':''}" onclick="nav('bookmarks')">Bookmarks</button><button class="nav ${state.view==='admin'?'active':''}" onclick="nav('admin')">Admin</button><a class="nav" href="./production-status.html">Production Status</a><div class="status">Deploy Visible Version<br/>อัปเดตเพื่อให้เห็นผลทันที<br/>Production path: React + Supabase</div></aside>`}
function bottom(){return `<nav class="bottomNav mobileOnly"><button class="${state.view==='gallery'?'active':''}" onclick="nav('gallery')">หน้าแรก</button><button class="${state.view==='library'?'active':''}" onclick="nav('library')">ชั้น</button><button class="${state.view==='bookmarks'?'active':''}" onclick="nav('bookmarks')">บันทึก</button><button class="${state.view==='admin'?'active':''}" onclick="nav('admin')">Admin</button></nav>`}
function gallery(){const list=books.filter(b=>(b.title+b.author+b.category).toLowerCase().includes((state.query||'').toLowerCase()));return `<main class="content"><section class="hero"><span class="badge">DEPLOY UPDATED</span><h1>คลังหนังสือดิจิทัล</h1><p>เวอร์ชันนี้อัปเดตบนหน้าเว็บให้เห็นทันที: ยืมหนังสือ, Bookmark, ชั้นส่วนตัว และ Dashboard</p></section><div class="toolbar"><input placeholder="ค้นหาหนังสือ" value="${state.query||''}" oninput="state.query=this.value;save();render()"></div><section class="grid">${list.map(b=>`<article class="card"><img src="${b.cover}" alt="${b.title}"><div class="body"><span class="pill">${b.category}</span><h3>${b.title}</h3><p>${b.description}</p><p class="muted">${b.author} • ${b.pages} หน้า</p></div><div class="actions"><button class="btn" ${state.library.includes(b.id)?'disabled':''} onclick="borrow('${b.id}')">${state.library.includes(b.id)?'อยู่ในชั้น':'ยืม'}</button><a class="btn secondary" href="./production-status.html">อ่าน</a><button class="btn secondary" onclick="mark('${b.id}')">Bookmark</button></div></article>`).join('')}</section></main>`}
function library(){return `<main class="content"><h1>ชั้นหนังสือของฉัน</h1>${state.library.length?state.library.map(id=>{const b=books.find(x=>x.id===id);return `<div class="row"><img src="${b.cover}"><div class="grow"><h3>${b.title}</h3><p class="muted">กำลังอ่าน • หน้า 1/${b.pages}</p></div><a class="btn secondary" href="./production-status.html">อ่าน</a><button class="btn danger" onclick="ret('${id}')">คืน</button></div>`}).join(''):'<div class="panel empty">ยังไม่มีหนังสือในชั้น</div>'}</main>`}
function bookmarks(){return `<main class="content"><h1>Bookmarks</h1>${state.bookmarks.length?state.bookmarks.map(m=>{const b=books.find(x=>x.id===m.bookId);return `<div class="row"><img src="${b.cover}"><div class="grow"><h3>${b.title}</h3><p class="muted">หน้า ${m.page} • ${new Date(m.at).toLocaleString('th-TH')}</p></div><a class="btn secondary" href="./production-status.html">อ่าน</a></div>`}).join(''):'<div class="panel empty">ยังไม่มี Bookmark</div>'}</main>`}
function admin(){return `<main class="content"><h1>Admin Dashboard</h1><div class="stats"><div class="stat"><b>${books.length}</b><span>หนังสือ</span></div><div class="stat"><b>1</b><span>ผู้ใช้ Demo</span></div><div class="stat"><b>${state.library.length}</b><span>กำลังยืม</span></div><div class="stat"><b>${state.bookmarks.length}</b><span>Bookmarks</span></div></div><section class="panel" style="padding:18px"><h2>Production Status</h2><p class="muted">Production backend services และ Supabase schema พร้อมแล้ว ส่วนหน้านี้เป็น deploy-visible fallback เพื่อให้ตรวจผลบนเว็บได้ทันที</p><a class="btn" href="./production-status.html">ดู Production Status</a></section></main>`}
function render(){document.getElementById('app').innerHTML=`<div class="app">${sidebar()}${state.view==='gallery'?gallery():state.view==='library'?library():state.view==='bookmarks'?bookmarks():admin()}${bottom()}</div>`}
render();
</script>
</body>
</html>
